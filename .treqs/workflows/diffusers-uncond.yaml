name: diffusers-uncond reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # wandb->trackio sync + roar put upload

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -m pip install --quiet requests || true
    # examples/unconditional_image_generation/requirements.txt + what it omits.
    # NOTE: diffusers itself is NOT installed. The example pins
    # check_min_version("0.40.0.dev0") and no such release exists on PyPI (latest
    # is 0.39.0), so the library must come from the checkout. It is put on
    # sys.path INSIDE the recorded roar-run argv, not by an install, so no
    # unresolvable `diffusers==0.40.0.dev0` pin enters the freeze.
    python -m pip install --quiet --upgrade-strategy only-if-needed \
      "accelerate>=0.16.0" datasets safetensors trackio wandb
    # torchvision only if absent, so a prebuilt CUDA torch is never displaced.
    python -c "import torchvision" 2>/dev/null || python -m pip install --quiet torchvision
    echo "--- key pins ---"
    python -m pip list --format=freeze | grep -Ei '^(torch|torchvision|accelerate|datasets|trackio|wandb|numpy|safetensors|huggingface-hub|protobuf)==' || true
    echo "--- local-version pins (trap 2: MUST be empty) ---"
    python -m pip list --format=freeze | grep '+' || echo "NONE"
    echo "--- PEP-503 duplicate names (trap 3: MUST be empty) ---"
    python -m pip list --format=freeze | sed 's/==.*//' | tr 'A-Z_.' 'a-z--' | sort | uniq -d || true
    echo "--- end preflight ---"
    roar --version
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n train --wandb-to-trackio -- sh -c 'PYTHONPATH=src:$PYTHONPATH exec python examples/unconditional_image_generation/train_unconditional.py --dataset_name=huggan/pokemon --cache_dir=data --resolution=64 --center_crop --random_flip --output_dir=ddpm-out --train_batch_size=16 --num_epochs=1 --save_images_epochs=1 --save_model_epochs=1 --gradient_accumulation_steps=1 --use_ema --learning_rate=1e-4 --lr_warmup_steps=10 --mixed_precision=no --logger=wandb --dataloader_num_workers=0 --ddpm_num_inference_steps=10 --eval_batch_size=4 --checkpointing_steps=100000'
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact ddpm-out/unet/diffusion_pytorch_model.safetensors model.name=diffusers-uncond model.version=1 license.id=Apache-2.0 license.name='Apache License 2.0' description='DDPM unconditional image generation (diffusers examples/unconditional_image_generation) — TRUNCATED reproduction: 1 epoch on huggan/pokemon, not converged' documentation.url=https://github.com/reproducible-ai/diffusers/blob/main/examples/unconditional_image_generation/README.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put ddpm-out/unet/diffusion_pytorch_model.safetensors hf://reproducible-ai/diffusers-uncond --public --yes --no-tag -m "TRUNCATED reproduction (1 epoch, not converged) — diffusers unconditional_image_generation DDPM"
  trace: off
